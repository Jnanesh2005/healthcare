{% extends 'tracker/base.html' %}

{% block content %}
  <div class="container mt-4">
    <h2>Health Analysis Result</h2>
    <p><strong>Prediction:</strong> {{ status }}</p>
    <p><strong>Details:</strong></p>
    <ul>
      <li>Temperature: {{ record.temperature }} °F</li>
      <li>Heart Rate: {{ record.heart_rate }} bpm</li>
      <li>SpO₂: {{ record.spo2 }} %</li>
    </ul>
    <a href="{% url 'submit_vitals' %}" class="btn btn-primary mt-3">Check Again</a>
  </div>
{% endblock %}
