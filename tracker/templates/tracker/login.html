<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }} {{ form.email }}<br>
  {{ form.password.label_tag }} {{ form.password }}<br>

  <button type="button" id="send-otp-btn">Send OTP</button>
  <div id="otp-sent-msg" style="color: green;"></div><br>

  {{ form.otp.label_tag }} {{ form.otp }}<br>

  <button type="submit">Login</button>
</form>

<script>
  function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
  }

  document.getElementById("send-otp-btn").addEventListener("click", function () {
    const email = document.getElementById("id_email").value;
    const password = document.getElementById("id_password").value;

    fetch('/send_otp/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCSRFToken()
      },
      body: JSON.stringify({ email: email, password: password })
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        document.getElementById("otp-sent-msg").innerText = "✅ OTP sent to your email!";
      } else {
        alert("❌ Failed to send OTP: " + data.message);
      }
    })
    .catch(err => {
      alert("❌ Error: " + err);
    });
  });
</script>
