services:
  - type: web
    name: healthmoniter
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn healthsite.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: healthsite.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: EMAIL_HOST_USER
        value: medteknie@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: your_gmail_app_password

databases:
  - name: healthcare-db
